<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJCinemaEmpire - Protected Admin Panel</title>
    <!-- Tailwind CSS & FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { red: '#e50914', gold: '#f5c518', dark: '#0f172a' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col p-4 md:p-8">

    <!-- LOGIN MODAL (No Background Hints) -->
    <div id="loginModal" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl w-full max-w-sm shadow-2xl relative">
            <div class="text-center mb-6">
                <h2 class="text-xl font-black text-amber-400 uppercase tracking-wider">Admin Login</h2>
                <p class="text-xs text-slate-400 mt-1">Authorized Access Only</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-400 mb-1">Username / Email</label>
                    <input type="text" id="loginUsername" required placeholder="" 
                           class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-100 focus:outline-none focus:border-brand-red">
                </div>
                <div>
                    <label class="block font-bold text-slate-400 mb-1">Password</label>
                    <input type="password" id="loginPassword" required placeholder="" 
                           class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-100 focus:outline-none focus:border-brand-red">
                </div>
                <button type="submit" class="w-full bg-brand-red hover:bg-red-700 text-white font-black py-3 rounded-lg shadow-xl transition uppercase tracking-wider">
                    LOGIN TO ADMIN PANEL
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN ADMIN CONTENT -->
    <div id="adminPanelContent" class="hidden">
        
        <!-- Header -->
        <div class="max-w-7xl mx-auto w-full flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-black text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-user-shield"></i> MJCinemaEmpire Admin Panel
                </h1>
                <p class="text-xs text-slate-400 mt-1">Logged in as: <span class="text-emerald-400 font-bold">javaidali5466@gmail.com</span></p>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="bg-brand-red hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-globe"></i> Open Live Website
                </a>
                <button onclick="logoutAdmin()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-lg border border-slate-700">
                    Logout
                </button>
            </div>
        </div>

        <!-- Admin Form & Lists Grid -->
        <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- ADD MOVIE FORM (1-Second Speed) -->
            <div class="lg:col-span-1 bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-2xl h-fit">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                    <h3 id="formTitle" class="text-sm font-bold text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle"></i> Add Movie To Website
                    </h3>
                    <button id="cancelBtn" onclick="resetForm()" class="hidden text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded">Cancel Edit</button>
                </div>

                <form id="movieForm" onsubmit="saveMovie(event)" class="space-y-4 text-xs">
                    <input type="hidden" id="editMovieId" value="">

                    <!-- Title -->
                    <div>
                        <label class="block font-bold text-slate-400 mb-1">Movie Title *</label>
                        <input type="text" id="movieTitle" required placeholder="" 
                               class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-slate-100 focus:outline-none focus:border-brand-red">
                    </div>

                    <!-- Poster -->
                    <div>
                        <label class="block font-bold text-slate-400 mb-1"><i class="fa-solid fa-image text-amber-400"></i> Poster Image (Gallery or URL) *</label>
                        <input type="file" id="posterFile" accept="image/*" onchange="handlePosterUpload(event)" 
                               class="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-slate-400 file:bg-slate-800 file:text-white file:border-0 file:rounded file:px-2 file:py-1 file:cursor-pointer">
                        <input type="url" id="posterUrl" placeholder="Or paste Poster Image URL" oninput="handlePosterUrl(event)" 
                               class="w-full bg-slate-950 border border-slate-800 rounded p-2 mt-2">
                        <div id="posterPreviewBox" class="mt-2 hidden">
                            <img id="posterPreview" class="w-20 h-28 object-cover rounded border border-slate-700">
                        </div>
                    </div>

                    <!-- Video File (Any Size) -->
                    <div>
                        <label class="block font-bold text-slate-400 mb-1"><i class="fa-solid fa-film text-emerald-400"></i> Movie Video File (Any Size) *</label>
                        <input type="file" id="videoFile" accept="video/*" onchange="handleVideoFileSelect(event)" 
                               class="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-slate-400 file:bg-emerald-600 file:text-white file:border-0 file:rounded file:px-2 file:py-1 file:cursor-pointer">
                        <input type="url" id="videoUrl" placeholder="Or paste direct Stream URL" 
                               class="w-full bg-slate-950 border border-slate-800 rounded p-2 mt-2">
                        <span id="videoStatus" class="text-[10px] text-emerald-400 font-bold block mt-1"></span>
                    </div>

                    <!-- Category & Quality -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-slate-400 mb-1">Category *</label>
                            <select id="movieCategory" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-slate-200">
                                <!-- Dynamic -->
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-400 mb-1">Quality *</label>
                            <select id="movieQuality" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-slate-200">
                                <option value="1080p">1080p FHD</option>
                                <option value="4K">4K UHD</option>
                                <option value="720p">720p HD</option>
                                <option value="480p">480p SD</option>
                            </select>
                        </div>
                    </div>

                    <!-- Rating & Audio -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-slate-400 mb-1">IMDb Rating *</label>
                            <input type="text" id="movieRating" required placeholder="e.g. 8.5" class="w-full bg-slate-950 border border-slate-800 rounded p-2">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-400 mb-1">Audio *</label>
                            <select id="movieAudio" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-slate-200">
                                <option value="Dual Audio">Dual Audio [Hindi+Eng]</option>
                                <option value="Multi Audio">Multi Audio</option>
                                <option value="Hindi Only">Hindi Only</option>
                                <option value="English Only">English Only</option>
                            </select>
                        </div>
                    </div>

                    <!-- MegaUp & GDrive Download Links -->
                    <div class="space-y-2 pt-2 border-t border-slate-800">
                        <label class="block font-bold text-emerald-400">Download Server Links:</label>
                        <input type="url" id="linkMegaUp" placeholder="MegaUp Link" class="w-full bg-slate-950 border border-slate-800 rounded p-2">
                        <input type="url" id="linkGDrive" placeholder="GDrive Link" class="w-full bg-slate-950 border border-slate-800 rounded p-2">
                        <input type="url" id="linkDirect" placeholder="Direct Cloud Link" class="w-full bg-slate-950 border border-slate-800 rounded p-2">
                    </div>

                    <!-- 1-Second Submit Button -->
                    <button type="submit" class="w-full bg-gradient-to-r from-red-600 via-amber-600 to-red-600 hover:opacity-90 text-white font-black py-3 rounded-lg shadow-xl transition flex items-center justify-center gap-2 tracking-wider text-sm">
                        <i class="fa-solid fa-bolt"></i> <span id="submitBtnText">ADD MOVIE (1 SECOND SPEED)</span>
                    </button>
                </form>
            </div>

            <!-- CATEGORY MANAGER & MOVIES LIST -->
            <div class="lg:col-span-2 space-y-6">

                <!-- CATEGORY MANAGER -->
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
                    <h3 class="text-sm font-bold text-amber-400 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-tags"></i> Category Management (Add / Edit / Delete)
                    </h3>
                    
                    <div class="flex gap-2 mb-4">
                        <input type="hidden" id="editCategoryId" value="">
                        <input type="text" id="categoryNameInput" placeholder="Category Name" 
                               class="flex-1 bg-slate-950 border border-slate-800 rounded p-2 text-xs">
                        <button onclick="saveCategory()" id="saveCatBtn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded text-xs">
                            Add Category
                        </button>
                        <button onclick="resetCatForm()" id="cancelCatBtn" class="hidden bg-slate-800 text-slate-300 font-bold px-3 py-2 rounded text-xs">
                            Cancel
                        </button>
                    </div>

                    <div class="overflow-x-auto max-h-40 custom-scrollbar">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="bg-slate-950 text-slate-400 border-b border-slate-800">
                                    <th class="p-2">Category Name</th>
                                    <th class="p-2 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="categoryTableBody">
                                <!-- Injected dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- MOVIES LIST TABLE -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <h3 class="text-sm font-bold mb-4 flex items-center gap-2 text-slate-200">
                        <i class="fa-solid fa-list"></i> Managed Website Movies List
                    </h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="bg-slate-950 text-slate-400 border-b border-slate-800">
                                    <th class="p-2.5">Poster</th>
                                    <th class="p-2.5">Title</th>
                                    <th class="p-2.5">IMDb</th>
                                    <th class="p-2.5">Category</th>
                                    <th class="p-2.5 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="adminTableBody">
                                <!-- Injected dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Protected Script Engine -->
    <script>
        let db;
        let uploadedPosterData = "";
        let selectedVideoFile = null;

        // LOGIN ENGINE
        function checkSession() {
            if (sessionStorage.getItem('mj_admin_logged') === 'true') {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminPanelContent').classList.remove('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            if (user === 'javaidali5466@gmail.com' && pass === 'pakistan9872') {
                sessionStorage.setItem('mj_admin_logged', 'true');
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminPanelContent').classList.remove('hidden');
            } else {
                alert("Invalid Username or Password!");
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('mj_admin_logged');
            location.reload();
        }

        // DATABASE ENGINE
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("MJCinemaFinalDB", 5);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains("movies")) {
                        db.createObjectStore("movies", { keyPath: "id" });
                    }
                    if (!db.objectStoreNames.contains("categories")) {
                        db.createObjectStore("categories", { keyPath: "id" });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e);
            });
        }

        window.onload = async function() {
            checkSession();
            await initDB();
            loadCategories();
            renderTable();
        };

        // File Selection Handlers
        function handlePosterUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedPosterData = event.target.result;
                    document.getElementById('posterPreview').src = uploadedPosterData;
                    document.getElementById('posterPreviewBox').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function handlePosterUrl(e) {
            uploadedPosterData = e.target.value;
            if (uploadedPosterData) {
                document.getElementById('posterPreview').src = uploadedPosterData;
                document.getElementById('posterPreviewBox').classList.remove('hidden');
            }
        }

        function handleVideoFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                selectedVideoFile = file;
                document.getElementById('videoStatus').innerText = `✓ Selected: ${file.name} (${(file.size / (1024 * 1024)).toFixed(1)} MB)`;
            }
        }

        // Category CRUD
        function loadCategories() {
            const tx = db.transaction("categories", "readonly");
            const store = tx.objectStore("categories");
            const request = store.getAll();

            request.onsuccess = () => {
                let categories = request.result;
                if (categories.length === 0) {
                    categories = [
                        { id: '1', name: 'Bollywood' },
                        { id: '2', name: 'Hollywood' },
                        { id: '3', name: 'Action' },
                        { id: '4', name: 'Sci-Fi' }
                    ];
                    const addTx = db.transaction("categories", "readwrite");
                    categories.forEach(c => addTx.objectStore("categories").put(c));
                }

                const select = document.getElementById('movieCategory');
                select.innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');

                const tbody = document.getElementById('categoryTableBody');
                tbody.innerHTML = categories.map(c => `
                    <tr class="border-b border-slate-800">
                        <td class="p-2 font-bold text-slate-200">${c.name}</td>
                        <td class="p-2 text-center space-x-2">
                            <button onclick="editCategory('${c.id}', '${c.name}')" class="text-blue-400 hover:underline">Edit</button>
                            <button onclick="deleteCategory('${c.id}')" class="text-red-400 hover:underline">Delete</button>
                        </td>
                    </tr>
                `).join('');
            };
        }

        function saveCategory() {
            const input = document.getElementById('categoryNameInput');
            const name = input.value.trim();
            const editId = document.getElementById('editCategoryId').value;

            if (name) {
                const tx = db.transaction("categories", "readwrite");
                tx.objectStore("categories").put({ id: editId || Date.now().toString(), name });
                
                tx.oncomplete = () => {
                    resetCatForm();
                    loadCategories();
                    notifyChange();
                };
            }
        }

        function editCategory(id, name) {
            document.getElementById('editCategoryId').value = id;
            document.getElementById('categoryNameInput').value = name;
            document.getElementById('saveCatBtn').innerText = "Update Category";
            document.getElementById('cancelCatBtn').classList.remove('hidden');
        }

        function deleteCategory(id) {
            if (confirm("Delete this category?")) {
                const tx = db.transaction("categories", "readwrite");
                tx.objectStore("categories").delete(id);
                tx.oncomplete = () => {
                    loadCategories();
                    notifyChange();
                };
            }
        }

        function resetCatForm() {
            document.getElementById('editCategoryId').value = "";
            document.getElementById('categoryNameInput').value = "";
            document.getElementById('saveCatBtn').innerText = "Add Category";
            document.getElementById('cancelCatBtn').classList.add('hidden');
        }

        // 1-Second Save Movie Engine
        function saveMovie(e) {
            e.preventDefault();

            const editId = document.getElementById('editMovieId').value;
            const title = document.getElementById('movieTitle').value;
            const category = document.getElementById('movieCategory').value;
            const quality = document.getElementById('movieQuality').value;
            const rating = document.getElementById('movieRating').value;
            const audio = document.getElementById('movieAudio').value;
            const videoUrl = document.getElementById('videoUrl').value;
            const megaup = document.getElementById('linkMegaUp').value;
            const gdrive = document.getElementById('linkGDrive').value;
            const direct = document.getElementById('linkDirect').value;

            const movieData = {
                id: editId || Date.now().toString(),
                title,
                poster: uploadedPosterData,
                videoFile: selectedVideoFile,
                videoUrl,
                category,
                quality,
                rating,
                audio,
                megaup,
                gdrive,
                direct
            };

            const tx = db.transaction("movies", "readwrite");
            tx.objectStore("movies").put(movieData);

            tx.oncomplete = () => {
                resetForm();
                renderTable();
                notifyChange();
                alert(editId ? "Movie Updated in 1 second!" : "Movie Published in 1 second!");
            };
        }

        function renderTable() {
            const tx = db.transaction("movies", "readonly");
            const store = tx.objectStore("movies");
            const request = store.getAll();

            request.onsuccess = () => {
                const movies = request.result;
                const tbody = document.getElementById('adminTableBody');

                if (movies.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No movies found. Add movies above!</td></tr>`;
                    return;
                }

                tbody.innerHTML = movies.map(m => `
                    <tr class="border-b border-slate-800 hover:bg-slate-950/50">
                        <td class="p-2.5">
                            <img src="${m.poster || 'https://via.placeholder.com/50'}" class="w-8 h-11 object-cover rounded">
                        </td>
                        <td class="p-2.5 font-bold text-slate-200">${m.title}</td>
                        <td class="p-2.5 text-amber-400 font-bold">${m.rating || '8.5'}</td>
                        <td class="p-2.5 text-slate-400">${m.category}</td>
                        <td class="p-2.5 text-center space-x-2">
                            <button onclick="editMovie('${m.id}')" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white px-2 py-1 rounded transition">
                                <i class="fa-solid fa-pen"></i> Edit
                            </button>
                            <button onclick="deleteMovie('${m.id}')" class="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-2 py-1 rounded transition">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `).join('');
            };
        }

        function editMovie(id) {
            const tx = db.transaction("movies", "readonly");
            const store = tx.objectStore("movies");
            const request = store.get(id);

            request.onsuccess = () => {
                const m = request.result;
                if (!m) return;

                document.getElementById('editMovieId').value = m.id;
                document.getElementById('movieTitle').value = m.title;
                document.getElementById('movieCategory').value = m.category;
                document.getElementById('movieQuality').value = m.quality;
                document.getElementById('movieRating').value = m.rating;
                document.getElementById('movieAudio').value = m.audio;
                document.getElementById('videoUrl').value = m.videoUrl || '';
                document.getElementById('linkMegaUp').value = m.megaup || '';
                document.getElementById('linkGDrive').value = m.gdrive || '';
                document.getElementById('linkDirect').value = m.direct || '';

                uploadedPosterData = m.poster;
                selectedVideoFile = m.videoFile || null;

                if (m.poster) {
                    document.getElementById('posterPreview').src = m.poster;
                    document.getElementById('posterPreviewBox').classList.remove('hidden');
                }

                document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen"></i> Edit Movie Details';
                document.getElementById('submitBtnText').innerText = 'UPDATE MOVIE DETAILS';
                document.getElementById('cancelBtn').classList.remove('hidden');
            };
        }

        function deleteMovie(id) {
            if (confirm("Are you sure you want to delete this movie from the website?")) {
                const tx = db.transaction("movies", "readwrite");
                tx.objectStore("movies").delete(id);
                tx.oncomplete = () => {
                    renderTable();
                    notifyChange();
                    alert("Movie deleted from website!");
                };
            }
        }

        function resetForm() {
            document.getElementById('movieForm').reset();
            document.getElementById('editMovieId').value = "";
            uploadedPosterData = "";
            selectedVideoFile = null;
            document.getElementById('posterPreviewBox').classList.add('hidden');
            document.getElementById('videoStatus').innerText = "";
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus-circle"></i> Add Movie To Website';
            document.getElementById('submitBtnText').innerText = 'ADD MOVIE (1 SECOND SPEED)';
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function notifyChange() {
            localStorage.setItem('mj_last_update', Date.now().toString());
        }
    </script>
</body>
</html>
